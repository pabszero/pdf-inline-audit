[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-inline-audit"
version = "0.2.1"
description = "Reproducible corpus statistics for PDF inline image payloads"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pypdf==6.21.1"]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "build>=1,<2"]

[project.scripts]
pdf-inline-audit = "pdf_inline_audit:main"

[tool.setuptools]
py-modules = ["pdf_inline_audit"]

[tool.ruff]
line-length = 100
target-version = "py310"

